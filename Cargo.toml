[workspace]
resolver = "3"
members = [
    "crates/*", "apps/*", "xtask",
    # Craft Sheets (git subtree of storytold/gridcraft) and Craft Slides (storytold/deckcraft).
    "sheets/crates/*", "sheets/apps/*", "sheets/xtask",
    "slides/crates/*", "slides/apps/*", "slides/xtask",
]
default-members = [
    "crates/*", "apps/wordcraft", "apps/wordcraft-cli", "xtask",
    "sheets/crates/*", "sheets/apps/gridcraft", "sheets/apps/gridcraft-cli",
    "slides/crates/*", "slides/apps/deckcraft", "slides/apps/deckcraft-cli",
]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/hossamTahaHussein/craft-collab-suite"

[workspace.dependencies]
# internal
wordcraft-geom = { path = "crates/geom" }
wordcraft-doc = { path = "crates/doc" }
wordcraft-fonts = { path = "crates/fonts" }
wordcraft-layout = { path = "crates/layout" }
wordcraft-docx = { path = "crates/docx" }
wordcraft-docbin = { path = "crates/docbin" }
wordcraft-formats = { path = "crates/formats" }
wordcraft-render = { path = "crates/render" }
wordcraft-pdf = { path = "crates/pdf" }
wordcraft-proof = { path = "crates/proof" }
wordcraft-engine = { path = "crates/engine" }
wordcraft-collab = { path = "crates/collab" }
craft-collab-core = { path = "crates/collab-core" }
craft-collab-link = { path = "crates/collab-link" }
craft-collab-ui = { path = "crates/collab-ui" }
craft-collab-agent = { path = "crates/collab-agent" }
wordcraft-mcp = { path = "crates/mcp" }
wordcraft-zotero = { path = "crates/zotero" }
wordcraft-control-key = { path = "crates/control-key" }
wordcraft-ui-egui = { path = "crates/ui-egui" }
wordcraft-metafile = { path = "crates/metafile" }
# Craft Sheets
gridcraft-core = { path = "sheets/crates/core" }
gridcraft-numfmt = { path = "sheets/crates/numfmt" }
gridcraft-formula = { path = "sheets/crates/formula" }
gridcraft-functions = { path = "sheets/crates/functions" }
gridcraft-model = { path = "sheets/crates/model" }
gridcraft-calc = { path = "sheets/crates/calc" }
gridcraft-xlsx = { path = "sheets/crates/xlsx" }
gridcraft-chart = { path = "sheets/crates/chart" }
gridcraft-engine = { path = "sheets/crates/engine" }
gridcraft-ui-egui = { path = "sheets/crates/ui-egui" }
gridcraft-mcp = { path = "sheets/crates/mcp" }
gridcraft-pdf = { path = "sheets/crates/pdf" }
gridcraft-math = { path = "sheets/crates/math" }
gridcraft-collab = { path = "sheets/crates/collab" }
# Craft Slides
deckcraft-geom = { path = "slides/crates/geom" }
deckcraft-color = { path = "slides/crates/color" }
deckcraft-metafile = { path = "slides/crates/metafile" }
deckcraft-model = { path = "slides/crates/model" }
deckcraft-fonts = { path = "slides/crates/fonts" }
deckcraft-text = { path = "slides/crates/text" }
deckcraft-render = { path = "slides/crates/render" }
deckcraft-pdf = { path = "slides/crates/pdf" }
deckcraft-pptx = { path = "slides/crates/pptx" }
deckcraft-format = { path = "slides/crates/format" }
deckcraft-anim = { path = "slides/crates/anim" }
deckcraft-engine = { path = "slides/crates/engine" }
deckcraft-mcp = { path = "slides/crates/mcp" }
deckcraft-collab = { path = "slides/crates/collab" }
deckcraft-ui-egui = { path = "slides/crates/ui-egui" }
deckcraft-media = { path = "slides/crates/media" }
# codecs (ported from FilmCraft, same owner and licence)
deckcraft-bitstream = { path = "slides/crates/bitstream" }
deckcraft-h264 = { path = "slides/crates/h264" }
deckcraft-hevc = { path = "slides/crates/hevc" }
deckcraft-vp9 = { path = "slides/crates/vp9" }
deckcraft-av1 = { path = "slides/crates/av1" }
deckcraft-isobmff = { path = "slides/crates/isobmff" }
deckcraft-matroska = { path = "slides/crates/matroska" }
deckcraft-ogg = { path = "slides/crates/ogg" }
deckcraft-opus = { path = "slides/crates/opus" }

# foundation
kurbo = { version = "0.13", features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
rustc-hash = "2"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; CONTRIBUTING.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
proptest = "1"
rayon = "1"
unicode-bidi = "0.3"
unicode-segmentation = "1"
unicode-linebreak = "0.1"
unicode-script = "0.5"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "meta", "nfa-pikevm", "unicode"] }

# text / rendering / formats
skrifa = "0.47"
subsetter = "0.2.6"
harfrust = "0.15"
# WOFF / WOFF2 web fonts added by the user (#582): pure Rust (MIT); its brotli and zlib decoders
# (brotli-decompressor, flate2) are already in the tree.
wuff = "0.2.9"
# WOFF2's brotli stream, decoded ahead of wuff so its glyph point counts are checked first (#3703).
# The same crate and version wuff already decodes it with (no new code in the build): pure Rust,
# `forbid(unsafe_code)` in its default build, no_std-capable (builds for wasm), BSD-3-Clause/MIT.
brotli-decompressor = "6"
vello_cpu = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
craft-pdf = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7", version = "=0.1.0", default-features = false, features = ["write", "write-simple-text"] }
craft-update = { git = "https://github.com/storytold/craft-libs", version = "=0.1.0", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7", features = ["egui"] }
craft-media = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7", version = "=0.1.0", default-features = false }
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7", version = "=0.1.0" }
# One native window per workbook (Sheets): the window list, Window menu titles and the viewport driver.
craft-window = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7", default-features = false, features = ["egui"] }
vello_common = { version = "0.3", default-features = false }
i_overlay = "9"
# Sheets equations: RaTeX (MIT), exact pins vetted upstream (sheets/docs/decisions.md).
ratex-parser = "=0.1.14"
ratex-layout = "=0.1.14"
ratex-types = "=0.1.15"
ratex-font = "=0.1.15"
quick-xml = "0.42"
zip = { version = "9", default-features = false, features = ["deflate"] }
# zlib streams (compressed metafile pictures in `.doc` drawings); already in the lock as a dependency of other crates.
miniz_oxide = "0.9"
cfb = "0.16"
# Legacy text encodings (GBK/GB18030, Big5, Shift_JIS, EUC-KR, single-byte code pages) for plain
# text and CSV recipient lists (#778): encoding_rs ((Apache-2.0 OR MIT) AND BSD-3-Clause) and its
# detector chardetng (Apache-2.0 OR MIT), both pure Rust (Firefox's).
encoding_rs = "0.8"
chardetng = "1"
# Password-protected (agile-encrypted) Word documents: pure-Rust RustCrypto primitives.
aes = "0.9"
sha1 = "0.11"
sha2 = "0.11"
hmac = "0.13"
base64 = "0.23"
getrandom = "0.4"
zeroize = "1"
# Unix open flags (O_NONBLOCK for the engine's checked file reads, #3666); already in the lock as a
# dependency of other crates.
libc = "0.2"

# ui
egui = "0.37"
egui_extras = { version = "0.37", default-features = false }
eframe = { version = "0.37", default-features = false }
egui_kittest = "0.37"
# A monotonic clock that works on native and in the browser (`performance.now()`).
web-time = "1.1"
rfd = "0.17"
# The desktop's preferred language, for Sheets' first-run interface language (native only).
sys-locale = "0.3"
# Real font bytes for Sheets tests (Ubuntu Light, compiled into epaint).
epaint_default_fonts = "0.37"
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "deny"
type_complexity = "allow"
# Slides' code base relies on these (upstream deckcraft workspace lints).
self_named_constructors = "allow"
large_enum_variant = "allow"
result_large_err = "allow"

# Line tables keep file and line in panics and backtraces; full debug info
# for every test binary and dependency would multiply the target dir size.
# The test profile inherits both settings.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

# Required by craft-pdf: the backend rejects writers that failed during unwinding.
[patch.crates-io]
krilla = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7", version = "=0.8.2" }
ecolor = { git = "https://github.com/hossamTahaHussein/egui.git", rev = "d98babaa1edca214290a4ffcf54963bd19aa6a32" }
emath = { git = "https://github.com/hossamTahaHussein/egui.git", rev = "d98babaa1edca214290a4ffcf54963bd19aa6a32" }
epaint = { git = "https://github.com/hossamTahaHussein/egui.git", rev = "d98babaa1edca214290a4ffcf54963bd19aa6a32" }
epaint_default_fonts = { git = "https://github.com/hossamTahaHussein/egui.git", rev = "d98babaa1edca214290a4ffcf54963bd19aa6a32" }
egui = { git = "https://github.com/hossamTahaHussein/egui.git", rev = "d98babaa1edca214290a4ffcf54963bd19aa6a32" }
egui-winit = { git = "https://github.com/hossamTahaHussein/egui.git", rev = "d98babaa1edca214290a4ffcf54963bd19aa6a32" }
egui-wgpu = { git = "https://github.com/hossamTahaHussein/egui.git", rev = "d98babaa1edca214290a4ffcf54963bd19aa6a32" }
egui_glow = { git = "https://github.com/hossamTahaHussein/egui.git", rev = "d98babaa1edca214290a4ffcf54963bd19aa6a32" }
egui_extras = { git = "https://github.com/hossamTahaHussein/egui.git", rev = "d98babaa1edca214290a4ffcf54963bd19aa6a32" }
egui_kittest = { git = "https://github.com/hossamTahaHussein/egui.git", rev = "d98babaa1edca214290a4ffcf54963bd19aa6a32" }
egui_system_font_provider = { git = "https://github.com/hossamTahaHussein/egui.git", rev = "d98babaa1edca214290a4ffcf54963bd19aa6a32" }
eframe = { git = "https://github.com/hossamTahaHussein/egui.git", rev = "d98babaa1edca214290a4ffcf54963bd19aa6a32" }
egui_demo_lib = { git = "https://github.com/hossamTahaHussein/egui.git", rev = "d98babaa1edca214290a4ffcf54963bd19aa6a32" }
egui_inspection = { git = "https://github.com/hossamTahaHussein/egui.git", rev = "d98babaa1edca214290a4ffcf54963bd19aa6a32" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
